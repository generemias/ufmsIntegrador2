<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="760" fill="#ffffff" />
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    Diagrama Entidade-Relacionamento — Ótica Smart IA
  </text>

  <!-- clientes -->
  <g>
    <rect x="40" y="70" width="220" height="150" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <rect x="40" y="70" width="220" height="30" rx="6" fill="#4338ca"/>
    <text x="150" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="white">clientes</text>
    <text x="52" y="118" font-size="12" fill="#1e293b">PK  id</text>
    <text x="52" y="136" font-size="12" fill="#1e293b">nome</text>
    <text x="52" y="154" font-size="12" fill="#1e293b">email (UNIQUE)</text>
    <text x="52" y="172" font-size="12" fill="#1e293b">telefone</text>
    <text x="52" y="190" font-size="12" fill="#1e293b">data_cadastro</text>
  </g>

  <!-- produtos -->
  <g>
    <rect x="780" y="70" width="220" height="170" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <rect x="780" y="70" width="220" height="30" rx="6" fill="#0e7490"/>
    <text x="890" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="white">produtos</text>
    <text x="792" y="118" font-size="12" fill="#1e293b">PK  id</text>
    <text x="792" y="136" font-size="12" fill="#1e293b">nome</text>
    <text x="792" y="154" font-size="12" fill="#1e293b">tipo_armacao</text>
    <text x="792" y="172" font-size="12" fill="#1e293b">faixa_preco</text>
    <text x="792" y="190" font-size="12" fill="#1e293b">preco</text>
    <text x="792" y="208" font-size="12" fill="#1e293b">descricao</text>
  </g>

  <!-- triagens -->
  <g>
    <rect x="40" y="310" width="240" height="190" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <rect x="40" y="310" width="240" height="30" rx="6" fill="#4338ca"/>
    <text x="160" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="white">triagens</text>
    <text x="52" y="358" font-size="12" fill="#1e293b">PK  id</text>
    <text x="52" y="376" font-size="12" fill="#1e293b">FK  cliente_id</text>
    <text x="52" y="394" font-size="12" fill="#1e293b">formato_rosto</text>
    <text x="52" y="412" font-size="12" fill="#1e293b">estilo_vida</text>
    <text x="52" y="430" font-size="12" fill="#1e293b">usa_grau</text>
    <text x="52" y="448" font-size="12" fill="#1e293b">metodo_deteccao</text>
    <text x="52" y="466" font-size="12" fill="#1e293b">data_triagem</text>
  </g>

  <!-- triagens_recomendacoes -->
  <g>
    <rect x="400" y="340" width="240" height="110" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <rect x="400" y="340" width="240" height="30" rx="6" fill="#a16207"/>
    <text x="520" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="white">triagens_recomendacoes</text>
    <text x="412" y="388" font-size="12" fill="#1e293b">PK,FK  triagem_id</text>
    <text x="412" y="406" font-size="12" fill="#1e293b">PK,FK  produto_id</text>
  </g>

  <!-- pedidos -->
  <g>
    <rect x="40" y="580" width="220" height="130" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <rect x="40" y="580" width="220" height="30" rx="6" fill="#4338ca"/>
    <text x="150" y="600" text-anchor="middle" font-size="14" font-weight="bold" fill="white">pedidos</text>
    <text x="52" y="628" font-size="12" fill="#1e293b">PK  id</text>
    <text x="52" y="646" font-size="12" fill="#1e293b">FK  cliente_id</text>
    <text x="52" y="664" font-size="12" fill="#1e293b">data_pedido</text>
    <text x="52" y="682" font-size="12" fill="#1e293b">status</text>
  </g>

  <!-- itens_pedido -->
  <g>
    <rect x="400" y="560" width="240" height="150" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <rect x="400" y="560" width="240" height="30" rx="6" fill="#be185d"/>
    <text x="520" y="580" text-anchor="middle" font-size="14" font-weight="bold" fill="white">itens_pedido</text>
    <text x="412" y="608" font-size="12" fill="#1e293b">PK  id</text>
    <text x="412" y="626" font-size="12" fill="#1e293b">FK  pedido_id</text>
    <text x="412" y="644" font-size="12" fill="#1e293b">FK  produto_id</text>
    <text x="412" y="662" font-size="12" fill="#1e293b">quantidade</text>
    <text x="412" y="680" font-size="12" fill="#1e293b">preco_unitario</text>
  </g>

  <!-- relationships -->
  <!-- clientes -> triagens -->
  <line x1="160" y1="220" x2="160" y2="305" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="168" y="265" font-size="11" fill="#334155">1:N</text>

  <!-- clientes -> pedidos -->
  <path d="M 110 220 C 60 350, 60 480, 110 578" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="30" y="400" font-size="11" fill="#334155">1:N</text>

  <!-- triagens -> triagens_recomendacoes -->
  <line x1="280" y1="395" x2="396" y2="395" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="388" font-size="11" fill="#334155">1:N</text>

  <!-- triagens_recomendacoes -> produtos -->
  <path d="M 560 338 C 650 280, 750 220, 820 243" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="280" font-size="11" fill="#334155">N:1</text>

  <!-- pedidos -> itens_pedido -->
  <line x1="260" y1="630" x2="396" y2="630" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="622" font-size="11" fill="#334155">1:N</text>

  <!-- itens_pedido -> produtos -->
  <path d="M 560 558 C 700 420, 820 320, 870 243" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="400" font-size="11" fill="#334155">N:1</text>

  <text x="520" y="740" text-anchor="middle" font-size="11" fill="#64748b">
    Chaves primárias (PK) e estrangeiras (FK) conforme database/schema.sql
  </text>
</svg>
